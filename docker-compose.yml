services:
  postgres:
    image: postgres:16-alpine
    container_name: routeflow_db_postgres
    environment:
      POSTGRES_DB: routeflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - 5436:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
